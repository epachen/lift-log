<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E9E7E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --chalk:#E9E7E2; --chalkDeep:#DAD7D0; --steel:#242A30; --steelSoft:#4A545E;
  --line:#C3BFB6; --red:#B8332A; --blue:#1F5C8B; --yellow:#E0AC1C; --green:#2C7A4B;
  --paper:#F4F2EE;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --sans:'Helvetica Neue',Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--chalk);color:var(--steel);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{padding-top:env(safe-area-inset-top)}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font-family:var(--sans);cursor:pointer}
input{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--steelSoft);font-weight:600}
.btn{border:none;border-radius:2px;padding:15px 22px;width:100%;font-size:14px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:var(--steel);
  display:block;margin-bottom:8px}
.btn.red{background:var(--red)} .btn.green{background:var(--green)}
.btn.ghost{background:transparent;color:var(--steelSoft);border:1px solid var(--line)}
.btn.small{padding:9px 14px;font-size:12px;margin-bottom:0}
.btn:disabled{opacity:.4}
.pad{padding:0 18px 40px}
.hd{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 4px}
.card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--steel);
  margin-bottom:12px;padding:14px 14px 8px}
.card.done{border-color:var(--green);border-left-color:var(--green)}
.card h3{font-size:18px;font-weight:700;margin:3px 0 0;letter-spacing:-.01em}
.howbtn{background:none;border:1px solid var(--line);border-radius:2px;padding:7px 11px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--steelSoft);margin-top:8px}
.how{margin-top:10px;border:1px solid var(--line)}
.how svg{width:100%;height:150px;display:block;background:#fff}
.cues{padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.cue{display:flex;gap:8px;margin-bottom:6px;font-size:13px;line-height:1.45}
.cue span:first-child{color:var(--red);font-family:var(--mono);font-weight:700}
.swaps{padding:10px 12px;border-top:1px solid var(--line);background:var(--chalkDeep)}
.swap{display:block;width:100%;text-align:left;margin-top:7px;padding:9px 10px;background:#fff;
  border:1px solid var(--line);border-radius:2px}
.swap b{font-size:13px;display:block} .swap i{font-size:11.5px;color:var(--steelSoft);font-style:normal;display:block;margin-top:2px}
.loadup{margin-top:10px;background:var(--yellow);color:var(--steel);padding:7px 10px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.setno{font-family:var(--mono);font-size:12px;color:var(--steelSoft);font-weight:600}
.inp{width:100%;padding:11px 10px;font-size:16px;font-weight:600;color:var(--steel);
  background:#fff;border:1px solid var(--line);border-radius:2px;outline:none}
.inp.filled{background:var(--chalkDeep)}
.inp.top{background:#E8F1EA;border-color:var(--green)}
.last{font-family:var(--mono);font-size:10px;color:var(--steelSoft);padding-bottom:6px;letter-spacing:.04em}
.bar{height:6px;background:var(--chalkDeep);margin-top:14px}
.bar > i{display:block;height:100%;background:var(--red)}
.note{padding:14px;background:var(--paper);border:1px solid var(--line);font-size:13px;
  color:var(--steelSoft);line-height:1.65;margin-top:22px}
.note strong{color:var(--steel)}
.sticky{position:sticky;top:0;background:var(--chalk);padding:18px 0 12px;
  border-bottom:1px solid var(--line);z-index:20}
.rest{position:fixed;left:0;right:0;bottom:0;background:var(--steel);color:var(--paper);
  padding:12px 18px calc(16px + env(safe-area-inset-bottom));z-index:60;max-width:460px;margin:0 auto}
.rest .t{font-family:var(--mono);font-size:30px;font-weight:700}
.rest .track{height:3px;background:#39414A;margin-top:8px}
.rest .track > i{display:block;height:100%;background:var(--yellow);transition:width 1s linear}
.rung{display:block;width:100%;text-align:left;background:transparent;color:var(--steel);
  border:1px solid var(--line);border-radius:2px;padding:13px 14px;margin-bottom:8px}
.rung.on{background:var(--steel);color:var(--paper);border-color:var(--steel)}
.rung.past{color:var(--steelSoft)}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:8px}
.spark > i{flex:1;max-width:22px;background:var(--steelSoft)}
.spark > i.now{background:var(--red)}
.warm{margin-top:14px;padding:14px;background:var(--steel);color:var(--paper)}
.warm div{font-size:13px;margin-top:7px;line-height:1.45;opacity:.9}
.plates{display:flex;gap:4px}
.plates > i{width:7px;height:14px;border-radius:1px;display:block}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);max-width:460px;margin:0 auto}
.tab{background:none;border:none;padding:10px 4px 9px;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--steelSoft)}
.tab.on{color:var(--steel)}
.tab .lb{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on .dot{position:absolute;top:2px;width:16px;height:2px;background:var(--red)}

/* ---------- today ---------- */
.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.metric{background:var(--paper);border:1px solid var(--line);padding:11px 10px;text-align:center}
.metric .v{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.metric .l{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--steelSoft);
  text-transform:uppercase;margin-top:3px}
.metric .t{height:3px;background:var(--chalkDeep);margin-top:7px}
.metric .t > i{display:block;height:100%}
.check{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--line);border-radius:2px;padding:12px 13px;margin-bottom:7px;color:var(--steel)}
.check.on{background:#E8F1EA;border-color:var(--green)}
.box{width:19px;height:19px;border:2px solid var(--line);border-radius:2px;flex:none;
  display:grid;place-items:center;font-size:12px;font-weight:700;color:transparent}
.check.on .box{background:var(--green);border-color:var(--green);color:#fff}
.check .tx{font-size:14px;font-weight:600;flex:1}
.check .sub{font-size:11.5px;color:var(--steelSoft);font-weight:400;display:block;margin-top:2px}
.check.on .tx{text-decoration:line-through;text-decoration-color:var(--line)}
.del{background:none;border:none;color:var(--line);font-family:var(--mono);font-size:15px;padding:0 2px}
.week{display:flex;gap:5px;margin-top:12px}
.week > div{flex:1;text-align:center}
.week .d{font-family:var(--mono);font-size:9px;color:var(--steelSoft);letter-spacing:.06em}
.week .p{height:26px;margin-top:4px;background:var(--chalkDeep);position:relative}
.week .p > i{position:absolute;bottom:0;left:0;right:0;background:var(--green);display:block}
.week .p.today{outline:2px solid var(--steel);outline-offset:1px}
.tapz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:9px}
.tapz button{background:#fff;border:1px solid var(--line);border-radius:2px;padding:11px 4px;
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--steel)}
.rt{padding:13px;border:1px solid var(--line);background:var(--paper);margin-bottom:8px}
.rt .h{font-size:14px;font-weight:700} .rt .b{font-size:12.5px;color:var(--steelSoft);margin-top:4px;line-height:1.5}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:3px 7px;
  border-radius:2px;text-transform:uppercase;font-weight:700}
code{font-family:var(--mono);font-size:11.5px;background:var(--chalkDeep);padding:2px 5px;border-radius:2px;
  word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================ data ============================ */
const PROGRAM = {
A:{name:"Workout A",lifts:[
 {id:"legpress",dia:"legpress",name:"Leg press",sets:3,lo:10,hi:12,inc:5,unit:"kg",
  cues:["Feet shoulder-width, mid-platform","Lower until the knees reach about 90°","Push through the heels, don't slam the lockout"],
  swaps:[{id:"rackgoblet",name:"Rack goblet squat",dia:"goblet",why:"5 racks — always one free"},

 {id:"cablerow",dia:"cablerow",name:"Seated cable row",sets:3,lo:10,hi:12,inc:2.5,unit:"kg",

  swaps:[{id:"dbrow",name:"One-arm dumbbell row",dia:"csrow",why:"Bench + dumbbell, always available"}]},
 {id:"dbpress",dia:"dbpress",name:"Dumbbell shoulder press",sets:2,lo:10,hi:12,inc:1,unit:"kg",
  cues:["Seated with the back supported","Start at ear height","Press up, not forward — don't flare the ribs"],

         {id:"legpressB",name:"Leg press",dia:"legpress",why:"If you want to go heavier"}]},

 {id:"incline",dia:"incline",name:"Incline dumbbell press",sets:3,lo:8,hi:12,inc:2,unit:"kg",
  cues:["Bench at about 30°, no steeper","Weight of ONE dumbbell","Wrists stacked over the elbows"],
  swaps:[{id:"flatdb",name:"Flat dumbbell press",dia:"dbbench",why:"If the incline benches are gone"}]},
 {id:"csrow",dia:"csrow",name:"Chest-supported row",sets:3,lo:10,hi:12,inc:2.5,unit:"kg",
  cues:["Chest stays glued to the pad","Elbows drive back past your ribs","Pause for a beat at the top"],
  swaps:[{id:"dbrowB",name:"One-arm dumbbell row",dia:"csrow",why:"Bench + dumbbell fallback"},
         {id:"machrow",name:"Any machine row",dia:"cablerow",why:"Whatever's free"}]},
 {id:"lateral",dia:"lateral",name:"Lateral raise",sets:2,lo:12,hi:15,inc:1,unit:"kg",
  cues:["Go light — lighter than feels right","Lead with the elbows, not the hands","Stop at shoulder height"],
  swaps:[{id:"cablelat",name:"Cable lateral raise",dia:"lateral",why:"Smoother if the cable stack is free"}]}]}
};
const CORE=[
 {id:"crunch",dia:"crunch",name:"Crunches",sets:3,lo:15,hi:20,inc:0,unit:"bw",
  cues:["Curl the ribs toward the hips","Don't yank on your neck","Slow — 2 seconds up, 2 down"],swaps:[]},
 {id:"plank",dia:"plank",name:"Plank",sets:3,lo:30,hi:45,inc:0,unit:"sec",
  cues:["Elbows under the shoulders","Squeeze the glutes so the hips don't sag","Stop when form breaks, not when the timer ends"],swaps:[]},
 {id:"sideplank",dia:"sideplank",name:"Side plank",sets:2,lo:20,hi:30,inc:0,unit:"sec",
  cues:["Stack the hips and the feet","Push the bottom shoulder away from your ear","One set per side"],swaps:[]}];
const WARMUP=["5 minutes on the bike or treadmill — warm up, don't tire out",
 "10 bodyweight squats, 10 arm circles each way",
 "One light set of your first exercise at about half your working weight"];
const RUNGS=[["Lat pulldown","Build to 8 clean reps at roughly your bodyweight."],
 ["Negatives","Jump to the top, lower for 5 seconds. 3 sets of 3–5."],
 ["Assisted machine","Set the assistance so 6–8 is hard. Drop it every fortnight."],
 ["Inverted rows","Bar in the rack at hip height, chest to bar. Lower it to make it harder."],
 ["First strict pull-up","Chin over the bar, dead hang, no kipping."]];
const REST=90, KEY="liftlog.v1", TARGET=48;

/* ========================== diagrams ========================== */
const P=a=>({h:[a[0],a[1]],n:[a[2],a[3]],p:[a[4],a[5]],k:[a[6],a[7]],a:[a[8],a[9]],e:[a[10],a[11]],d:[a[12],a[13]]});
const L=arr=>arr.map(v=>v.join(",")).join(" ");
function fig(j,ghost,arm2){
  const c=ghost?"#C3BFB6":"#242A30", w=ghost?3:4;
  let s=`<g stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none">`;
  s+=`<circle cx="${j.h[0]}" cy="${j.h[1]}" r="7" fill="${c}" stroke="none"/>`;
  s+=`<polyline points="${L([j.n,j.p,j.k,j.a])}"/>`;
  s+=`<polyline points="${L([j.n,j.e,j.d])}"/>`;
  if(arm2) s+=`<polyline points="${L([j.n,arm2[0],arm2[1]])}"/>`;
  return s+"</g>";
}
const ground=(y=126)=>`<line x1="8" y1="${y}" x2="192" y2="${y}" stroke="#C3BFB6" stroke-width="2" stroke-dasharray="4 4"/>`;
const bar=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#4A545E" stroke-width="4" stroke-linecap="round"/>`;
const pad=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#1F5C8B" stroke-width="7" stroke-linecap="round" opacity=".85"/>`;
const bell=(x,y)=>`<circle cx="${x}" cy="${y}" r="6" fill="#B8332A"/>`;
let ai=0;
function arrow(a,b,c,d){const id="m"+(ai++);
  return `<defs><marker id="${id}" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#E0AC1C"/></marker></defs>`+
  `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#E0AC1C" stroke-width="3" marker-end="url(#${id})" stroke-linecap="round"/>`;}

const DIA={
 legpress:()=>pad(34,52,62,100)+bar(128,52,152,92)
   +fig(P([56,62,64,70,82,88,112,68,130,86,70,82,78,88]),1)
   +fig(P([56,62,64,70,82,88,122,74,152,60,70,82,78,88]))+arrow(118,100,146,82),
 dbbench:()=>pad(58,92,120,92)+ground()
   +fig(P([60,82,74,86,112,88,130,100,134,124,80,100,88,96]),1)
   +fig(P([60,82,74,86,112,88,130,100,134,124,84,70,88,58]))+bell(88,58)+arrow(104,92,104,62),
 pulldown:()=>bar(60,30,132,30)+pad(78,98,112,98)+ground()
   +fig(P([88,60,88,72,94,98,118,98,122,122,92,50,96,32]),1)
   +fig(P([88,60,88,72,94,98,118,98,122,122,72,80,90,68]))+arrow(126,44,126,74),
 cablerow:()=>pad(56,100,86,100)+ground()
   +fig(P([68,58,68,70,74,100,108,96,130,112,92,76,116,80]),1)
   +fig(P([66,56,66,68,74,100,108,96,130,112,52,78,84,78]))
   +`<line x1="116" y1="80" x2="176" y2="86" stroke="#4A545E" stroke-width="2"/>`+arrow(126,60,96,60),
 dbpress:()=>pad(76,100,110,100)+ground()
   +fig(P([90,54,90,66,94,100,118,100,122,124,76,80,74,66]),1)
   +fig(P([90,54,90,66,94,100,118,100,122,124,86,50,88,34]))+bell(88,34)+arrow(120,72,120,42),
 goblet:()=>ground()
   +fig(P([96,28,96,42,96,80,96,102,96,124,106,58,106,50]),1)
   +fig(P([86,46,88,58,78,88,104,100,98,124,98,72,98,64]))+bell(98,64)+arrow(130,52,130,86),
 rdl:()=>ground()
   +fig(P([98,28,98,42,98,80,98,102,98,124,102,60,102,78]),1)
   +fig(P([66,54,76,60,106,76,100,102,98,124,84,78,84,98]))+bell(84,100)+arrow(132,48,118,74),
 incline:()=>pad(64,112,116,70)+ground()
   +fig(P([110,60,102,72,80,100,106,110,122,124,92,96,102,90]),1)
   +fig(P([110,60,102,72,80,100,106,110,122,124,106,62,110,48]))+bell(110,48)+arrow(130,86,136,58),
 csrow:()=>pad(70,110,106,62)+ground()
   +fig(P([70,54,80,64,104,94,110,114,114,126,80,86,80,106]),1)
   +fig(P([70,54,80,64,104,94,110,114,114,126,62,84,78,78]))+arrow(46,106,46,80),
 lateral:()=>ground()
   +fig(P([100,28,100,44,100,84,100,104,100,124,88,62,86,80]),1,[[112,62],[114,80]])
   +fig(P([100,28,100,44,100,84,100,104,100,124,76,46,58,44]),0,[[124,46],[142,44]])
   +bell(58,44)+bell(142,44)+arrow(60,76,52,56),
 crunch:()=>ground(120)
   +fig(P([62,104,76,110,104,114,126,96,134,118,70,100,62,96]),1)
   +fig(P([74,84,84,94,104,114,126,96,134,118,78,84,72,78]))+arrow(56,92,66,74),
 plank:()=>ground(112)+fig(P([56,68,70,76,112,92,134,100,152,110,70,106,54,106]))
   +`<line x1="70" y1="76" x2="70" y2="106" stroke="#E0AC1C" stroke-width="2" stroke-dasharray="3 3"/>`
   +`<text x="118" y="70" font-family="ui-monospace,monospace" font-size="9" fill="#4A545E">hips level</text>`,
 sideplank:()=>ground(112)
   +fig(P([54,66,68,74,112,94,134,102,152,110,68,104,54,104]),0,[[70,54],[72,36]])
   +`<text x="102" y="68" font-family="ui-monospace,monospace" font-size="9" fill="#4A545E">stack the hips</text>`,
 hang:()=>bar(52,26,148,26)
   +fig(P([100,58,100,70,100,98,100,116,100,126,100,48,100,28]),1)
   +fig(P([100,36,100,48,100,78,100,100,100,116,84,44,96,28]))+arrow(134,66,134,42)
};
const svg=id=>DIA[id]?`<svg viewBox="0 0 200 140" role="img" aria-label="form diagram"><rect width="200" height="140" fill="#fff"/>${DIA[id]()}</svg>`:"";


/* ========================= daily config ========================= */
const DEFAULT_TASKS=[
 {id:"protein",t:"Hit protein target",s:"Every meal. This is the one people miss."},
 {id:"water",t:"2L of water",s:"Eight cups. Tap the counter above."},
 {id:"steps",t:"7–8k steps",s:"Across the whole day, not one walk."},
 {id:"creatine",t:"Creatine, 5g",s:"Any time of day. Consistency is all that matters."},
 {id:"sleep",t:"7 hours in bed",s:"Blunts everything else if you skip it."},
 {id:"5bx",t:"5BX — Chart 1",s:"Non-gym mornings. Eleven minutes."}
];
const MORNING=[
 ["Big glass of water","You're dehydrated after eight hours. Do this before coffee."],
 ["5BX or a walk","Eleven minutes, or get out for twenty. Non-gym days only."],
 ["Protein at breakfast","Eggs, Greek yoghurt, a shake — whatever's fastest."],
 ["Pack the gym bag now","Deciding at 5pm is how sessions get skipped."]
];
const BEDTIME=[
 ["Phone down 30 minutes before","The single highest-leverage change for sleep quality."],
 ["Lights low from 9:30","Signals melatonin. Lamps, not the ceiling light."],
 ["Gym gear by the door","Removes one decision from tomorrow."],
 ["In bed by 10:30","Seven and a half hours before a 6am alarm."]
];

/* ========================== storage ========================== */
const KEY2="liftlog.v2";
function load(){try{const r=localStorage.getItem(KEY2);if(r)return migrate(JSON.parse(r));
  const old=localStorage.getItem("liftlog.v1");
  if(old){const d=JSON.parse(old);return migrate({sessions:d.sessions||[],rung:d.rung||0})}
  }catch(e){}
  return migrate({});}
function migrate(d){
  d.sessions=d.sessions||[]; d.rung=d.rung||0; d.days=d.days||{};
  d.tasks=d.tasks||DEFAULT_TASKS.slice(); d.bodyweight=d.bodyweight||null;
  return d;}
function save(d){try{localStorage.setItem(KEY2,JSON.stringify(d));return true}catch(e){return false}}

const todayKey=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
function day(k){k=k||todayKey();
  if(!S.data.days[k]) S.data.days[k]={water:0,steps:0,protein:0,done:{}};
  return S.data.days[k];}

/* ========================== state ========================== */
let S={tab:"today",view:null,data:load(),workout:"A",entries:{},swaps:{},open:{},result:null,warm:true,timer:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const base=w=>PROGRAM[w].lifts.concat(CORE);
const resolve=l=>S.swaps[l.id]?Object.assign({},l,{id:S.swaps[l.id].id,name:S.swaps[l.id].name,dia:S.swaps[l.id].dia,from:l.name,swaps:[]}):l;
const lifts=()=>base(S.workout).map(resolve);

function lastOf(w){for(let i=S.data.sessions.length-1;i>=0;i--) if(S.data.sessions[i].workout===w) return S.data.sessions[i];return null}
function target(w,l){
  const last=lastOf(w); if(!last) return {weight:"",earned:false,prev:null};
  const rows=last.entries[l.id]; if(!rows||!rows.length) return {weight:"",earned:false,prev:null};
  const done=rows.filter(r=>r.reps!=="");
  if(done.length<l.sets) return {weight:rows[0].weight||"",earned:false,prev:rows};
  const allTop=done.every(r=>Number(r.reps)>=l.hi), n=Number(rows[0].weight);
  if(allTop&&l.inc>0&&!isNaN(n)&&n>0) return {weight:String(n+l.inc),earned:true,prev:rows};
  return {weight:rows[0].weight||"",earned:false,prev:rows};
}
const nextW=()=>!S.data.sessions.length?"A":(S.data.sessions[S.data.sessions.length-1].workout==="A"?"B":"A");
function week(){const s=S.data.sessions;if(!s.length)return 1;
  return Math.min(17,Math.floor((Date.now()-new Date(s[0].date))/864e5/7)+1)}
const proteinTarget=()=>S.data.bodyweight?Math.round(S.data.bodyweight*1.8):null;
const trainedToday=()=>S.data.sessions.some(s=>s.date.slice(0,10)===todayKey());

/* ================== Apple Shortcuts URL handling ================== */
/* A Shortcut can read Health data and open  ...?steps=8234           */
function handleParams(){
  const q=new URLSearchParams(location.search); if(![...q.keys()].length) return;
  const d=day();
  if(q.has("steps")) d.steps=Math.max(0,parseInt(q.get("steps"),10)||0);
  if(q.has("water")) d.water=Math.min(30,d.water+(parseInt(q.get("water"),10)||1));
  if(q.has("protein")) d.protein=Math.max(0,parseInt(q.get("protein"),10)||0);
  if(q.has("check")) d.done[q.get("check")]=true;
  if(q.has("tab")&&["today","train","progress","routines"].includes(q.get("tab"))) S.tab=q.get("tab");
  save(S.data);
  history.replaceState({},"",location.pathname);
}

  const pct=goal?Math.min(100,v/goal*100):0;
  return `<div class="metric"><div class="v">${v}${unit||""}</div><div class="l">${label}</div>
    <div class="t"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}

function card(l,i){
  const t=target(S.workout,l), rows=S.entries[l.id]||[], open=S.open[l.id];
  const done=rows.filter(r=>r.reps!=="").length===l.sets;
  const unit=l.unit==="sec"?"sec":l.unit==="bw"?"reps":"kg";
  let h=`<div class="card${done?" done":""}" data-card="${l.id}">
   <div style="display:flex;justify-content:space-between;gap:10px">
    <div style="flex:1"><div class="eyebrow">${String(i+1).padStart(2,"0")} · ${l.sets} × ${l.lo}–${l.hi}${l.unit==="sec"?" sec":""}</div>
      <h3>${esc(l.name)}</h3>
      ${l.from?`<div style="font-family:var(--mono);font-size:10px;color:var(--blue);margin-top:3px;letter-spacing:.06em">SWAPPED FROM ${esc(l.from.toUpperCase())}</div>`:""}
    </div>
    <div class="tick" style="font-family:var(--mono);font-size:11px;color:var(--green);font-weight:700;padding-top:12px">${done?"✓ DONE":""}</div>
   </div>
   <button class="howbtn" data-how="${l.id}">${open?"− HIDE FORM":"+ HOW TO DO IT"}</button>`;
  if(open){
    h+=`<div class="how">${svg(l.dia)}<div class="cues">
      ${l.cues.map(c=>`<div class="cue"><span>—</span><span>${esc(c)}</span></div>`).join("")}
      <div style="font-family:var(--mono);font-size:9px;color:var(--steelSoft);margin-top:8px;letter-spacing:.08em">GREY = START · DARK = FINISH</div></div>`;
    if(l.swaps&&l.swaps.length) h+=`<div class="swaps"><div class="eyebrow">Machine taken?</div>
      ${l.swaps.map(s=>`<button class="swap" data-swap="${l.id}" data-alt="${s.id}"><b>${esc(s.name)}</b><i>${esc(s.why)}</i></button>`).join("")}</div>`;
    h+=`</div>`;
  }
  if(t.earned) h+=`<div class="loadup">▲ LOAD UP — you hit ${l.hi} on every set last time</div>`;
  h+=`<div style="margin-top:12px">`+rows.map((r,s)=>{
    const f=r.reps!=="", tp=f&&Number(r.reps)>=l.hi;
    return `<div class="setrow"><div class="setno">${s+1}</div>
     ${l.unit==="bw"?`<div style="font-family:var(--mono);font-size:11px;color:var(--steelSoft)">bodyweight</div>`
      :`<input class="inp" inputmode="decimal" value="${esc(r.weight)}" placeholder="${l.unit==="sec"?"—":"kg"}"
         ${l.unit==="sec"?"disabled":""} data-l="${l.id}" data-s="${s}" data-f="weight">`}
     <input class="inp${f?(tp?" top":" filled"):""}" inputmode="numeric" value="${esc(r.reps)}" placeholder="${unit}"
       data-l="${l.id}" data-s="${s}" data-f="reps"></div>`;
  }).join("")+`</div>`;
  if(t.prev) h+=`<div class="last">LAST: ${t.prev.map(r=>l.unit==="bw"?(r.reps||"–"):`${r.weight||"–"}×${r.reps||"–"}`).join("   ")}</div>`;
  return h+`</div>`;
}

function tabbar(){
  const t=[["today","Today"],["train","Train"],["progress","Progress"],["routines","Routines"]];
  return `<nav class="tabs">${t.map(([k,l])=>`<button class="tab${S.tab===k&&!S.view?" on":""}" data-tab="${k}">
    <svg viewBox="0 0 24 24">${ICONS[k]}</svg><span class="lb">${l}</span></button>`).join("")}</nav>`;
}

function render(){
  let body;
  if(S.view==="session") body=vSession();
  else if(S.view==="summary") body=vSummary();
  else body={today:vToday,train:vTrain,progress:vProgress,routines:vRoutines}[S.tab]();
  document.getElementById("app").innerHTML=
   `<div style="padding:14px 18px 0;display:flex;justify-content:space-between;align-items:center">
     <div style="font-family:var(--mono);font-size:11px;letter-spacing:.24em;font-weight:700">LIFT&nbsp;LOG</div>
     <div class="plates"><i style="background:var(--red)"></i><i style="background:var(--blue)"></i>
     <i style="background:var(--yellow)"></i><i style="background:var(--green)"></i></div>
   </div>`+body;
  const old=document.querySelector(".tabs"); if(old) old.remove();
  if(S.view!=="session") document.body.insertAdjacentHTML("beforeend",tabbar());
  if(S.view!=="session") stopTimer();
}

/* -------- live input updates without re-render (keeps focus) -------- */
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.l) return;
  const id=el.dataset.l, s=Number(el.dataset.s), f=el.dataset.f;
  const lift=lifts().find(x=>x.id===id); if(!lift) return;
  S.entries[id][s][f]=el.value;
  if(f==="weight"){
    S.entries[id].forEach((r,i)=>{if(i>s&&r.reps===""){r.weight=el.value;
      const inp=document.querySelector(`input[data-l="${id}"][data-s="${i}"][data-f="weight"]`);
      if(inp) inp.value=el.value;}});
  }
  if(f==="reps"){
    const filled=el.value!=="", top=filled&&Number(el.value)>=lift.hi;
    el.className="inp"+(filled?(top?" top":" filled"):"");
    const c=document.querySelector(`[data-card="${id}"]`);
    const done=S.entries[id].filter(r=>r.reps!=="").length===lift.sets;
    c.classList.toggle("done",done); c.querySelector(".tick").textContent=done?"✓ DONE":"";
    updateCount(); if(filled) startTimer();
  }
});
function updateCount(){
  const n=Object.values(S.entries).flat().filter(r=>r.reps!=="").length;
  const total=lifts().reduce((a,l)=>a+l.sets,0);
  const el=document.querySelector(".sticky div[style*='mono']"); if(el) el.textContent=`${n}/${total}`;
  const fin=document.querySelector("[data-act='finish']"); if(fin) fin.disabled=n===0;
}

/* =========================== rest timer =========================== */
function startTimer(){
  stopTimer(); let left=REST;
  const el=document.createElement("div"); el.className="rest"; el.id="rest";
  el.innerHTML=`<div style="display:flex;align-items:baseline;justify-content:space-between">
    <div class="eyebrow" style="color:#8A949E">Rest</div><div class="t">${left}s</div>
    <button id="skiprest" style="background:none;border:none;color:#8A949E;font-family:var(--mono);font-size:11px;letter-spacing:.14em">SKIP</button>
  </div><div class="track"><i style="width:100%"></i></div>`;
  document.body.appendChild(el);
  el.querySelector("#skiprest").onclick=stopTimer;
  S.timer=setInterval(()=>{left--;
    const t=el.querySelector(".t"), b=el.querySelector(".track > i");
    if(t) t.textContent=Math.max(0,left)+"s";
    if(b) b.style.width=Math.max(0,left/REST*100)+"%";
    if(left<=0){ if(navigator.vibrate) navigator.vibrate([120,60,120]); stopTimer(); }},1000);
}
function stopTimer(){ if(S.timer){clearInterval(S.timer);S.timer=null} const e=document.getElementById("rest"); if(e) e.remove(); }

/* ============================ actions ============================ */
document.addEventListener("click",e=>{
  const b=e.target.closest("button, [data-del]"); if(!b) return;
  const d=b.dataset;

  if(d.del!==undefined){ e.stopPropagation();
    S.data.tasks=S.data.tasks.filter(t=>t.id!==d.del); save(S.data); render(); return; }
  if(d.tab){ S.view=null; S.tab=d.tab; render(); return; }
  if(d.task!==undefined){ const dd=day(); dd.done[d.task]=!dd.done[d.task]; save(S.data); render(); return; }
  if(d.how!==undefined){ S.open[d.how]=!S.open[d.how]; render(); return; }
  if(d.swap!==undefined){
    const src=base(S.workout).find(x=>x.id===d.swap), alt=src.swaps.find(x=>x.id===d.alt);
    S.swaps[d.swap]=alt; delete S.entries[d.swap];
    S.entries[alt.id]=Array.from({length:src.sets},()=>({weight:"",reps:""}));
    S.open[d.swap]=false; render(); return; }
  if(d.rung!==undefined){ S.data.rung=Number(d.rung); save(S.data); render(); return; }

  const dd=day();
  switch(d.act){
    case "paste": pasteFromClipboard(); break;
    case "water": dd.water=Math.min(30,dd.water+1); save(S.data); render(); break;
    case "protein": {
      const v=prompt("Protein just eaten (grams)","30");
      if(v!==null){ dd.protein=Math.max(0,dd.protein+(parseInt(v,10)||0)); save(S.data); render(); }
      break; }
    case "steps": {
      const v=prompt("Steps today","" + (dd.steps||""));
      if(v!==null){ dd.steps=Math.max(0,parseInt(v,10)||0); save(S.data); render(); }
      break; }
    case "bw": {
      const v=prompt("Bodyweight in kg — used only to work out your protein target","");
      const n=parseFloat(v); if(n>0){ S.data.bodyweight=n; save(S.data); render(); }
      break; }
    case "addtask": {
      const v=prompt("What do you want to do every day?");
      if(v&&v.trim()){ S.data.tasks.push({id:"c"+Date.now(),t:v.trim(),s:""}); save(S.data); render(); }
      break; }
    case "start": S.workout=d.w; S.swaps={}; S.open={}; S.warm=true; S.entries={};
      base(d.w).forEach(l=>{S.entries[l.id]=Array.from({length:l.sets},()=>({weight:target(d.w,l).weight||"",reps:""}))});
      S.view="session"; render(); break;
    case "warmdone": S.warm=false; render(); break;
    case "cancel": stopTimer(); S.view=null; S.tab="train"; render(); break;
    case "done": S.view=null; S.tab="today"; render(); break;
    case "finish": finish(); break;
    case "export": exportData(); break;
    case "import": importData(); break;
  }
});


/* --- clipboard handoff: iOS gives a home-screen web app its own storage
   container, separate from Safari. A Shortcut that opens a URL writes to
   Safari's copy, not this one. So instead the Shortcut copies "steps=8234"
   to the clipboard and opens the app, and this reads it. --- */
function pasteFromClipboard(){
  if(!navigator.clipboard||!navigator.clipboard.readText){
    const v=prompt("Paste what the Shortcut copied"); if(v) applyPayload(v); return; }
  navigator.clipboard.readText().then(applyPayload).catch(()=>{
    const v=prompt("iOS blocked the automatic read. Paste it here instead:");
    if(v) applyPayload(v); });
}
function applyPayload(txt){
  const raw=String(txt||"").trim(); if(!raw){alert("Clipboard was empty.");return}
  const q=new URLSearchParams(raw.replace(/^[?&]/,"")); const dd=day(); let n=0;
  if(q.has("steps")){ dd.steps=Math.max(0,parseInt(q.get("steps"),10)||0); n++; }
  if(q.has("water")){ dd.water=Math.min(30,dd.water+(parseInt(q.get("water"),10)||1)); n++; }
  if(q.has("protein")){ dd.protein=Math.max(0,parseInt(q.get("protein"),10)||0); n++; }
  if(q.has("check")){ dd.done[q.get("check")]=true; n++; }
  if(!n){ const bare=parseInt(raw.replace(/[^0-9]/g,""),10);   // a plain number = steps
    if(bare>0){ dd.steps=bare; n++; } }
  if(n){ save(S.data); render(); }
  else alert("Couldn't read that. The Shortcut should copy something like  steps=8234");
}

function finish(){
  const clean={}; let sets=0;
  Object.keys(S.entries).forEach(id=>{
    const kept=S.entries[id].filter(r=>r.reps!=="");
    if(kept.length){clean[id]=kept;sets+=kept.length}});
  const earned=[];
  lifts().forEach(l=>{
    const r=clean[l.id]; if(!r||r.length<l.sets||l.inc===0) return;
    if(r.every(x=>Number(x.reps)>=l.hi)){ const w=Number(r[0].weight);
      if(!isNaN(w)&&w>0) earned.push({name:l.name,from:w,to:w+l.inc}); }});
  S.data.sessions.push({id:Date.now(),date:new Date().toISOString(),workout:S.workout,entries:clean});
  save(S.data);
  S.result={sets,earned}; stopTimer(); S.view="summary"; render();
}

function exportData(){
  const blob=new Blob([JSON.stringify(S.data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="lift-log-backup-"+todayKey()+".json"; a.click(); URL.revokeObjectURL(a.href);
}
function importData(){
  const i=document.createElement("input"); i.type="file"; i.accept="application/json";
  i.onchange=()=>{const f=i.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.sessions) throw 0;
      S.data=migrate(d); save(S.data); render(); alert("Restored "+d.sessions.length+" sessions.");
    }catch(e){alert("That file isn't a Lift Log backup.")}};
    r.readAsText(f)};
  i.click();
}

/* ============================== boot ============================== */
handleParams();
render();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&!S.view) render(); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
